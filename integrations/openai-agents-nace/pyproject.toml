[project]
name = "openai-agents-nace"
version = "0.1.0"
description = "Drex guardrails and a route picker for the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "nace-sdk==0.4.0",
    "openai-agents>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
